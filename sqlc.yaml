version: "2"
sql:
  - engine: "postgresql"
    queries: "./db/queries/"
    schema: "./db/schema/"
    gen:
      go:
        package: "db"
        out: "./db/sqlc/"
        sql_package: "database/sql"
        emit_json_tags: true
        overrides:
          - db_type: "pg_catalog.numeric"
            go_type: "float64"