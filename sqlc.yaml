version: "2"
sql:
- engine: "postgresql" # o "mysql", "sqlite"
  queries: "./db/queries/"
  schema: "./db/schema/"
  gen:
   go:
    package: "db"
    out: "./db/sqlc/"
    emit_json_tags: true
    overrides:
    - db_type: "pg_catalog.numeric"
      go_type: "float64"
    - db_type: "date"
      go_type:
        import: "github.com/jackc/pgx/v5/pgtype"
        package: "pgtype"
        type: "Date"

  