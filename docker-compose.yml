services:
  api:
    build: . 
    container_name: go-api
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=${host} 
      - DB_PORT=${puerto}
      - DB_USER=${usuario}
      - DB_PASSWORD=${password}
      - DB_NAME=${dbname}
    depends_on:
      - database
    env_file:
      - .env

  # Tu Base de Datos Postgres
  database:
    image: postgres:15-alpine 
    container_name: postgres-db
    environment:
      - POSTGRES_DB=${dbname}
      - POSTGRES_USER=${usuario}
      - POSTGRES_PASSWORD=${password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data 

volumes:
  pgdata: 
